<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d0e8f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="620" rx="8" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">系统架构图</text>

  <!-- ══════════ 第一层: UI 层 ══════════ -->
  <rect x="40" y="55" width="820" height="110" rx="10" fill="url(#g1)" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#1565c0">UI 展示层 (Vue3 + Naive UI)</text>

  <!-- 六个页面卡片 -->
  <rect x="60" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#333">词法分析</text>
  <text x="120" y="130" text-anchor="middle" font-size="9" fill="#888">LexerPage</text>

  <rect x="195" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="255" y="113" text-anchor="middle" font-size="11" fill="#333">文法分析</text>
  <text x="255" y="130" text-anchor="middle" font-size="9" fill="#888">GrammarPage</text>

  <rect x="330" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="390" y="113" text-anchor="middle" font-size="11" fill="#333">LL(1) 分析</text>
  <text x="390" y="130" text-anchor="middle" font-size="9" fill="#888">LL1Page</text>

  <rect x="465" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="525" y="113" text-anchor="middle" font-size="11" fill="#333">LLM 约束生成</text>
  <text x="525" y="130" text-anchor="middle" font-size="9" fill="#888">LLMPage</text>

  <rect x="600" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="660" y="113" text-anchor="middle" font-size="11" fill="#333">AST 相似度</text>
  <text x="660" y="130" text-anchor="middle" font-size="9" fill="#888">ASTPage</text>

  <rect x="735" y="88" width="120" height="58" rx="6" fill="white" stroke="#64b5f6" stroke-width="1"/>
  <text x="795" y="113" text-anchor="middle" font-size="11" fill="#333">语义分析</text>
  <text x="795" y="130" text-anchor="middle" font-size="9" fill="#888">SemanticPage</text>

  <!-- 向下箭头 -->
  <line x1="450" y1="170" x2="450" y2="195" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker></defs>

  <!-- ══════════ 第二层: 业务逻辑层 ══════════ -->
  <rect x="40" y="200" width="820" height="65" rx="10" fill="url(#g2)" stroke="#81c784" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="225" font-size="14" font-weight="bold" fill="#2e7d32">业务逻辑层</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#555">编排各模块调用顺序 · 数据流转 · 错误收集 · 结果聚合</text>

  <!-- 向下箭头 -->
  <line x1="450" y1="270" x2="450" y2="295" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══════════ 第三层: 核心算法层 ══════════ -->
  <rect x="40" y="300" width="820" height="180" rx="10" fill="url(#g3)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="323" font-size="14" font-weight="bold" fill="#e65100">核心算法层 (TypeScript)</text>

  <!-- lexer 模块 -->
  <rect x="60" y="338" width="180" height="120" rx="8" fill="white" stroke="#ff9800" stroke-width="1.2"/>
  <text x="150" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">lexer</text>
  <line x1="75" y1="368" x2="225" y2="368" stroke="#eee" stroke-width="0.8"/>
  <text x="75" y="385" font-size="10" fill="#555">• DFA 词法分析</text>
  <text x="75" y="400" font-size="10" fill="#555">• 五类 Token 切分</text>
  <text x="75" y="415" font-size="10" fill="#555">• 非法字符标记</text>
  <text x="75" y="430" font-size="10" fill="#555">• 注释跳过</text>
  <text x="75" y="445" font-size="10" fill="#555">→ Token[]</text>

  <!-- grammar 模块 -->
  <rect x="260" y="338" width="180" height="120" rx="8" fill="white" stroke="#ff9800" stroke-width="1.2"/>
  <text x="350" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">grammar</text>
  <line x1="275" y1="368" x2="425" y2="368" stroke="#eee" stroke-width="0.8"/>
  <text x="275" y="385" font-size="10" fill="#555">• Chomsky 型判定</text>
  <text x="275" y="400" font-size="10" fill="#555">• FIRST/FOLLOW 计算</text>
  <text x="275" y="415" font-size="10" fill="#555">• 预测分析表构造</text>
  <text x="275" y="430" font-size="10" fill="#555">• 推导/归约可视化</text>
  <text x="275" y="445" font-size="10" fill="#555">→ LL1AnalysisResult</text>

  <!-- parser 模块 -->
  <rect x="460" y="338" width="180" height="120" rx="8" fill="white" stroke="#ff9800" stroke-width="1.2"/>
  <text x="550" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">parser</text>
  <line x1="475" y1="368" x2="625" y2="368" stroke="#eee" stroke-width="0.8"/>
  <text x="475" y="385" font-size="10" fill="#555">• 递归下降 Parser</text>
  <text x="475" y="400" font-size="10" fill="#555">• AST 生成</text>
  <text x="475" y="415" font-size="10" fill="#555">• panic-mode 错误恢复</text>
  <text x="475" y="430" font-size="10" fill="#555">• AST 相似度 (TED)</text>
  <text x="475" y="445" font-size="10" fill="#555">• 语义分析</text>

  <!-- llm 模块 -->
  <rect x="660" y="338" width="180" height="120" rx="8" fill="white" stroke="#ff9800" stroke-width="1.2"/>
  <text x="750" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">llm</text>
  <line x1="675" y1="368" x2="825" y2="368" stroke="#eee" stroke-width="0.8"/>
  <text x="675" y="385" font-size="10" fill="#555">• 文法约束生成</text>
  <text x="675" y="400" font-size="10" fill="#555">• 结构化错误诊断</text>
  <text x="675" y="415" font-size="10" fill="#555">• 对照实验接口</text>
  <text x="675" y="430" font-size="10" fill="#555">• 流式响应处理</text>
  <text x="675" y="445" font-size="10" fill="#555">→ DiagnosisResult</text>

  <!-- 模块间调用箭头 -->
  <line x1="242" y1="398" x2="258" y2="398" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="442" y1="398" x2="458" y2="398" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="642" y1="398" x2="658" y2="398" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 向下箭头到外部 API -->
  <line x1="750" y1="485" x2="750" y2="510" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══════════ 第四层: 外部 API ══════════ -->
  <rect x="610" y="515" width="280" height="55" rx="10" fill="url(#g4)" stroke="#ba68c8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">外部 API</text>
  <text x="750" y="557" text-anchor="middle" font-size="11" fill="#555">DeepSeek V4 Pro (SSE 流式)</text>

  <!-- ══════════ types.ts 公共类型 ══════════ -->
  <rect x="60" y="520" width="160" height="45" rx="8" fill="white" stroke="#78909c" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="140" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#455a64">types.ts</text>
  <text x="140" y="555" text-anchor="middle" font-size="9" fill="#888">公共类型定义</text>

  <!-- types.ts 到各模块的虚线 -->
  <line x1="220" y1="535" x2="258" y2="470" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="220" y1="535" x2="350" y2="465" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="220" y1="535" x2="550" y2="465" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="220" y1="535" x2="750" y2="465" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- 图例 -->
  <rect x="60" y="580" width="820" height="30" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8"/>
  <circle cx="100" cy="595" r="5" fill="#90caf9"/><text x="112" y="599" font-size="9" fill="#555">UI 组件</text>
  <circle cx="200" cy="595" r="5" fill="#81c784"/><text x="212" y="599" font-size="9" fill="#555">业务逻辑</text>
  <circle cx="300" cy="595" r="5" fill="#ffb74d"/><text x="312" y="599" font-size="9" fill="#555">核心算法</text>
  <circle cx="400" cy="595" r="5" fill="#ba68c8"/><text x="412" y="599" font-size="9" fill="#555">外部 API</text>
  <line x1="500" y1="595" x2="530" y2="595" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="538" y="599" font-size="9" fill="#555">依赖关系</text>
  <line x1="640" y1="595" x2="670" y2="595" stroke="#999" stroke-width="1"/>
  <text x="678" y="599" font-size="9" fill="#555">数据流</text>
</svg>
